apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    model: us.anthropic.claude-sonnet-4-20250514-v1:0
    backend: amazonbedrock
    region: us-east-1
    anonymized: false
    language: english
    autoRemediation:
      enabled: true
      similarityRequirement: "40"
      resources:
        - Deployment
        - Pod
        - Service
        - Ingress
  analysis:
    interval: "30s"
  # Scan all namespaces - Kyverno controls where fixes can land
  targetNamespace: ""
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.4.33
  noCache: false
