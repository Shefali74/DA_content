# OOMKill trigger in "demo" namespace
# K8sGPT will detect this and auto-patch the memory limit
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    purpose: devnovate-demo
    ai-remediation: allowed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: demo
  labels:
    app: memory-hog
    demo: oomkill-autofix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
        - name: stress
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "128M", "--vm-hang", "1"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "64Mi"  # Intentionally too low - app needs 128M
              cpu: "200m"
