apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devnovate-demo
  region: us-east-1
  version: "1.32"
  tags:
    project: devnovate-mumbai
    purpose: conference-demo

iam:
  withOIDC: true

managedNodeGroups:
  - name: demo-nodes
    instanceType: m5.large
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    privateNetworking: false
    volumeSize: 30
    volumeType: gp3
    tags:
      role: demo

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: eks-pod-identity-agent
    version: latest

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]
    logRetentionInDays: 7
