# Same OOMKill pod but in "critical" namespace
# Kyverno will BLOCK K8sGPT from auto-fixing this
---
apiVersion: v1
kind: Namespace
metadata:
  name: critical
  labels:
    purpose: devnovate-demo
    ai-remediation: blocked
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: critical
  labels:
    app: memory-hog
    demo: oomkill-blocked
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
        - name: stress
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "128M", "--vm-hang", "1"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "64Mi"  # Same issue - but Kyverno blocks the AI fix
              cpu: "200m"
