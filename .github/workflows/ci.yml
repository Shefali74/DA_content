name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: Blog/kiro-crew/todo-service/build-todo-api

      - name: Run lint
        run: npm run lint
        working-directory: Blog/kiro-crew/todo-service/build-todo-api

      - name: Run tests
        run: npm test
        working-directory: Blog/kiro-crew/todo-service/build-todo-api