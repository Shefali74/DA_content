name: Cleanup PR Environment

on:
  pull_request:
    types: [closed]
    paths:
      - 'Blog/dynamic-pr-environment/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  IMAGE_NAME: pr-env-app-pr${{ github.event.number }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find and terminate MicroVM for this PR
        run: |
          echo "🗑️ Cleaning up PR #${{ github.event.number }} environment..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_ARN="arn:aws:lambda:${{ env.AWS_REGION }}:${ACCOUNT_ID}:microvm-image:${{ env.IMAGE_NAME }}"

          # Look up the MicroVM for this PR from DynamoDB mapping
          MICROVM_ID=$(aws dynamodb get-item \
            --table-name pr-environments \
            --key "{\"PK\":{\"S\":\"MICROVM#PR${{ github.event.number }}\"},\"SK\":{\"S\":\"MAPPING\"}}" \
            --region ${{ env.AWS_REGION }} \
            --query 'Item.microvm_id.S' --output text 2>/dev/null || echo "None")

          if [ "$MICROVM_ID" != "None" ] && [ "$MICROVM_ID" != "" ]; then
            echo "Terminating MicroVM: $MICROVM_ID"
            aws lambda-microvms terminate-microvm \
              --microvm-identifier "$MICROVM_ID" \
              --region ${{ env.AWS_REGION }} || true
          else
            echo "No MicroVM mapping found for PR #${{ github.event.number }}"
          fi

          # Also terminate any MicroVMs still running on this PR's image
          echo "Checking for any MicroVMs running on image: $IMAGE_ARN"
          RUNNING_MICROVMS=$(aws lambda-microvms list-microvms \
            --region ${{ env.AWS_REGION }} \
            --query "items[?imageArn=='${IMAGE_ARN}' && state!='TERMINATED'].microvmId" \
            --output text 2>/dev/null || echo "")

          if [ -n "$RUNNING_MICROVMS" ] && [ "$RUNNING_MICROVMS" != "None" ]; then
            for MVM_ID in $RUNNING_MICROVMS; do
              echo "Terminating leftover MicroVM: $MVM_ID"
              aws lambda-microvms terminate-microvm \
                --microvm-identifier "$MVM_ID" \
                --region ${{ env.AWS_REGION }} || true
            done
          fi

          # Wait for all MicroVMs to reach TERMINATED state
          echo "Waiting for MicroVMs to fully terminate..."
          for i in $(seq 1 30); do
            STILL_RUNNING=$(aws lambda-microvms list-microvms \
              --region ${{ env.AWS_REGION }} \
              --query "items[?imageArn=='${IMAGE_ARN}' && state!='TERMINATED'].microvmId" \
              --output text 2>/dev/null || echo "")
            if [ -z "$STILL_RUNNING" ] || [ "$STILL_RUNNING" = "None" ]; then
              echo "All MicroVMs terminated"
              break
            fi
            echo "  Still running (attempt $i/30): $STILL_RUNNING"
            sleep 10
          done

          echo "✅ MicroVM cleanup complete"

      - name: Delete MicroVM image for this PR
        continue-on-error: true
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_ARN="arn:aws:lambda:${{ env.AWS_REGION }}:${ACCOUNT_ID}:microvm-image:${{ env.IMAGE_NAME }}"
          echo "Deleting image: $IMAGE_ARN"

          # Retry delete up to 3 times (in case termination is still finalizing)
          for attempt in 1 2 3; do
            if aws lambda-microvms delete-microvm-image \
              --image-identifier "$IMAGE_ARN" \
              --region ${{ env.AWS_REGION }} 2>&1; then
              echo "✅ Image deleted"
              break
            fi
            echo "Delete attempt $attempt failed, waiting 15s..."
            sleep 15
          done

      - name: Clean up DynamoDB data for this PR
        run: |
          echo "Cleaning DynamoDB partition PR#${{ github.event.number }}..."

          # Query all items for this PR
          ITEMS=$(aws dynamodb query \
            --table-name pr-environments \
            --key-condition-expression "PK = :pk" \
            --expression-attribute-values '{":pk":{"S":"PR#${{ github.event.number }}"}}' \
            --projection-expression "PK, SK" \
            --region ${{ env.AWS_REGION }} \
            --output json | jq -c '.Items[]')

          if [ -z "$ITEMS" ]; then
            echo "No data found for PR #${{ github.event.number }}"
          else
            echo "$ITEMS" | while read -r item; do
              PK=$(echo $item | jq -r '.PK.S')
              SK=$(echo $item | jq -r '.SK.S')
              aws dynamodb delete-item \
                --table-name pr-environments \
                --key "{\"PK\":{\"S\":\"$PK\"},\"SK\":{\"S\":\"$SK\"}}" \
                --region ${{ env.AWS_REGION }}
            done
            echo "✅ Deleted items for PR #${{ github.event.number }}"
          fi

          # Also clean up the token and mapping entries
          aws dynamodb delete-item \
            --table-name pr-environments \
            --key "{\"PK\":{\"S\":\"MICROVM#PR${{ github.event.number }}\"},\"SK\":{\"S\":\"MAPPING\"}}" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true

      - name: Clean up S3 artifacts
        continue-on-error: true
        run: |
          aws s3 rm s3://${{ secrets.S3_BUCKET }}/pr-${{ github.event.number }}/ --recursive || true
          echo "✅ S3 artifacts cleaned"

      - name: Post cleanup confirmation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🗑️ PR Environment Destroyed\n\nThe Lambda MicroVM environment for this PR has been terminated and all associated data cleaned up.\n\n- MicroVM: terminated\n- DynamoDB data: deleted\n- S3 artifacts: removed`
            });
